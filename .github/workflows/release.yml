name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API tokens.
# Nothing runs unless you push a v* tag or trigger it manually:
#   - push tag "vX.Y.Z"      → build, test, publish to PyPI, GitHub Release
#   - manual (Actions tab)   → publish to TestPyPI (rehearsal) or PyPI
#
# One-time setup required on PyPI/TestPyPI: register this workflow as a
# trusted publisher (PyPI project: aiguard-gate, repo: alreshi/aiguard,
# workflow: release.yml). See docs/releases.md.
#
# Supply-chain controls (SLSA provenance, SBOM, dependency audit) BLOCK the
# release when they fail. Verify a published release with:
#   gh attestation verify dist/aiguard_gate-*.whl --repo alreshi/aiguard

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test, lint, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      # Blocks the release on known vulnerabilities in the dependency tree.
      - run: pip-audit

  build:
    name: Build, attest, and SBOM
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # SLSA provenance signing (Sigstore OIDC)
      attestations: write  # store attestations in the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          artifact-name: sbom.spdx.json
          output-file: dist/sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Exclude the SBOM from the PyPI upload; it ships with the GitHub Release.
      - run: rm -f dist/sbom.spdx.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          case "$GITHUB_REF_NAME" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes $PRERELEASE_FLAG
