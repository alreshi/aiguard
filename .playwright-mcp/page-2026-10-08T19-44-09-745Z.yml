        - tabpanel "Project description. Focus will be moved to the description." [ref=f5e51]:
          - generic [ref=f5e52]:
            - generic [ref=f5e54]:
              - heading "AI Guard (Beta)" [level=1] [ref=f5e55]:
                - link:
                  - /url: "#user-content-ai-guard-beta"
                - text: AI Guard (Beta)
              - paragraph [ref=f5e56]: AI Guard is designed to protect AI Systems from misuse, manipulation, and harmful inputs. It ensures that the AI behaves as intended and does not deviate from its guidelines or generate harmful content.
              - heading "Features" [level=1] [ref=f5e57]:
                - link:
                  - /url: "#user-content-features"
                - text: Features
              - list [ref=f5e58]:
                - listitem [ref=f5e59]: Input Sanitization
                - listitem [ref=f5e60]: Prompt Classification
                - listitem [ref=f5e61]: Manipulation Detection
                - listitem [ref=f5e62]: Ethical Compliance Check
                - listitem [ref=f5e63]: Response Validation
                - listitem [ref=f5e64]: Logging and Monitoring
                - listitem [ref=f5e65]: Customizable Settings
                - listitem [ref=f5e66]: Interactive Testing Mode (Uses Ollama)
                - listitem [ref=f5e67]: Fallback Mechanisms
                - listitem [ref=f5e68]: Scalability and Extensability
              - heading "How It Works" [level=1] [ref=f5e69]:
                - link:
                  - /url: "#user-content-how-it-works"
                - text: How It Works
              - paragraph [ref=f5e70]: AI Guard protects AI Systems from misuse and harmful inputs by sanitizing user prompts to remove noise, classifying them as "non-toxic" (safe) or "toxic" (malicious) using a machine learning model and detecting manipulation attempts through predefined rules. It ensures ethical compliance by blocking prompts that request harmful or illegal actions and validates AI responses to prevent inappropriate content. The system logs all activities for auditing, operates interactively for testing, and includes a fallback mechanism to handle ambiguous cases by defaulting to "non-toxic". You can customize this however you'd like via the settings.yml file it supports features like input sanitization, prompt classification, and response validation making it ideal for chatbots, ai assistants, content moderation and research!
              - heading "Settings and Manipulation Rules" [level=1] [ref=f5e71]:
                - link:
                  - /url: "#user-content-settings-and-manipulation-rules"
                - text: Settings and Manipulation Rules
              - paragraph [ref=f5e72]: If you find any form of manipulation rule that can manipulate the AI assistant in any form of way you can add that said prompt to the manipulation_rules.txt file and you can open an issue stating a bypass you found. There are currently 583 different manipulation rules as of the first beta release and we're always looking to add more to this list that can really keep all AI safe from unrightful prompt engineering.
              - paragraph [ref=f5e73]: If you wish to tinker around with it and enable or disable whatever you dont like with in the whole system, you can head to the settings.yml file and enable or disable things. You can even go ahead and change the logs file to a whole different file if you wish.
